name: Build

# Every push and pull request builds and tests the add-on.
# Pushing a tag like v0.2.0 additionally publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version src/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi

      - name: Build the .xpi (syntax checks and unit tests included)
        run: ./build.sh

      - name: End-to-end test in Thunderbird ESR
        run: ./test/e2e/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: remove_duplicate_messages
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remove_duplicate_messages
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Remove Duplicate Messages ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            *.xpi SHA256SUMS
